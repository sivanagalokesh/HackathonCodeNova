# Test profile: run the concurrency suite on in-memory H2 (MySQL mode), schema from entities.
spring.datasource.url=jdbc:h2:mem:codenova;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
codenova.engine.processing-delay-ms=0
codenova.engine.retry-backoff-ms=10
