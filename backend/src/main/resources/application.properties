# ===== Server =====
server.port=${PORT:8080}

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:codenova}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:213166}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== SQL init (schema + seed run on startup) =====
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
# JPA must wait for schema.sql before validating
spring.jpa.defer-datasource-initialization=false

# ===== CodeNova processing engine defaults =====
codenova.engine.default-workers=5
codenova.engine.queue-capacity=1000
codenova.engine.max-retries=3
codenova.engine.retry-backoff-ms=400
# Simulated per-stage processing latency so the demo is watchable (real threads, real waits)
codenova.engine.processing-delay-ms=350
